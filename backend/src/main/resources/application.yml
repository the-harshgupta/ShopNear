server:
  port: 8081

spring:
  application:
    name: smart-retail-platform

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

  # Default datasource uses persistent file-based H2 database saved in ./data/retaildb
  # Set spring.profiles.active: mysql to connect to a live MySQL instance
  datasource:
    url: jdbc:h2:file:./data/retaildb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    # Render injects JWT_SECRET at deploy time. The fallback is for local development only.
    secret: ${JWT_SECRET:replace-this-local-development-secret-before-production}

---
# MySQL Profile for Production / MySQL Database Mode
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://localhost:3306/smart_retail_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
