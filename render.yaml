services:
  - type: web
    name: shopnear
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/stores
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SPRING_H2_CONSOLE_ENABLED
        value: "false"
      - key: JWT_SECRET
        generateValue: true
